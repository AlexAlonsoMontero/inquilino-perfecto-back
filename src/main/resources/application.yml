spring:
  application:
    name: inquilino-perfecto-back
  datasource:
    url: ${DB_URL:jdbc:postgresql://192.168.1.100:5433/inquilino_perfecto}
    username: ${DB_USER:alex}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.hibernate.SQL: debug
